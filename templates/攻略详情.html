<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攻略详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url("/static/background.png") center/cover fixed;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 50px auto;
            background: rgba(0,0,0,0.6);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
        }
        .content {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/guide" class="btn btn-outline-light mb-3">← 返回攻略列表</a>
        <h1 class="mb-4">{{ news.title }}</h1>
        <div class="content">{{ news.content }}</div>
    </div>
</body>
</html>
