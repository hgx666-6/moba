<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>个人账户 · 侧边栏导航</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url("/static/background.png") center/cover fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
        }
        
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.5);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #E5E7EB;
            position: relative;
            z-index: 100;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: #1F2937;
        }
        .navbar-toggler {
            background: transparent;
            border: none;
            font-size: 1rem;
            color: #4B5563;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .navbar-toggler:hover {
            background: #F3F4F6;
        }

        .sidebar {
            width: 260px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
            border-right: 1px solid #E5E7EB;
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding: 20px;
            height: 100%;
            z-index: 90;
        }
        
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #6B7280;
            margin: 16px 0 8px 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: #1F2937;
            font-size: 0.9rem;
            font-weight: 500;
            background: transparent;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
        }
        .menu-item i {
            width: 20px;
            color: #4B5563;
            font-size: 0.9rem;
            text-align: center;
        }
        .menu-item:hover {
            background: #F3F4F6;
            transform: translateX(4px);
        }
        .menu-item.active {
            background: rgba(59,130,246,0.1);
            color: #3B82F6;
        }
        .menu-item.active i {
            color: #3B82F6;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
                box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .sidebar-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.4);
                z-index: 80;
                display: none;
                backdrop-filter: blur(2px);
            }
            .sidebar-overlay.show {
                display: block;
            }
        }
        @media (min-width: 769px) {
            .sidebar-overlay {
                display: none !important;
            }
            .navbar-toggler {
                display: none;
            }
        }

        .main-content {
            flex: 1;
            overflow: hidden;
            width: 100%;
        }
        .content-header {
            padding: 20px 28px;
            border-bottom: 1px solid rgba(229,231,235,0.3);
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(8px);
        }
        .content-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1F2937;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .scroll-area {
            height: calc(100% - 62px);
            overflow-y: auto;
            padding: 28px;
        }

        .content-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .account-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .avatar-section {
            display: flex;
            align-items: center;
            gap: 24px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            box-shadow:0 8px 15px rgba(0,0,0,0.3);
            padding: 24px 28px;
            border-radius: 24px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .avatar-img {
            width: 88px;
            height: 88px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .avatar-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-info h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 6px;
        }
        .avatar-info p {
            color: #E5E7EB;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .info-card {
            border-radius: 24px;
            padding: 24px 28px;
            margin-bottom: 28px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            box-shadow:0 8px 15px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #FFFFFF;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 3px solid #3B82F6;
            padding-left: 12px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            flex: 1;
            min-width: 180px;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: #E5E7EB;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(229,231,235,0.61);
            border-radius: 14px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.57);
            transition: 0.2s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.1);
        }
        textarea {
            resize: vertical;
        }
        .password-group {
            background: rgba(254,249,230,0.55);
            border-radius: 20px;
            padding: 20px;
            margin-top: 12px;
        }
        .btn-save {
            background: rgba(59,130,246,0.51);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-save:hover {
            background: #2563EB;
            transform: translateY(-3px);
        }
        .btn-secondary {
            background: rgba(243,244,246,0.53);
            color: #4B5563;
            margin-left: 12px;
        }
        .btn-secondary:hover {
            background: #E5E7EB;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid rgba(237,242,247,0.3);
        }
    </style>
</head>
<body>
<div class="app-container">
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-user-circle"></i>
            <span>个人中心</span>
        </div>
        <button class="navbar-toggler" id="navbarToggleBtn">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <div class="content-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <div class="menu-title">功能菜单</div>
            <div class="sidebar-menu">
                <a href="/home" class="menu-item">
                    <i class="fas fa-user-circle"></i>
                    <span>个人中心</span>
                </a>
                <a href="/zhanji" class="menu-item">
                    <i class="fas fa-trophy"></i>
                    <span>查看战绩</span>
                </a>
                <a href="/tiezi" class="menu-item">
                    <i class="fas fa-file-alt"></i>
                    <span>查看帖子</span>
                </a>
                <a href="/chuzhuang" class="menu-item">
                    <i class="fas fa-shopping-bag"></i>
                    <span>获取出装</span>
                </a>
                <!-- ====================== 新增：游戏攻略菜单 ====================== -->
                <a href="/guide" class="menu-item">
                    <i class="fas fa-book-open"></i>
                    <span>游戏攻略</span>
                </a>
            </div>
        </div>
    </aside>

        <div class="sidebar-overlay" id="overlay"></div>

        <main class="main-content">
            <div class="content-header">
                <div class="content-title">
                    <i class="fas fa-id-card"></i> 我的账户
                </div>
            </div>
            <div class="scroll-area">
                <div class="account-container">
                    
                    <!-- 头像区域：直接读取本地电脑路径，不传到服务器 -->
                    <div class="avatar-section">
                        <div class="avatar-img">
                            <img id="userAvatar" 
                                 src="{{ user.avatar if user and user.avatar else '/static/avatar/default.png' }}" 
                                 style="width:100%;height:100%;object-fit:cover;">
                        </div>
                        <div class="avatar-info">
                            <h3>{{ login_user }}</h3>
                            <p><i class="fas fa-envelope"></i> {{ user.email if user else '未设置邮箱' }}</p>
                            <p><i class="fas fa-phone-alt"></i> {{ user.phone if user else '未设置手机' }}</p>
                            <div style="margin-top:10px;">
                                <button class="btn-save" style="padding:6px 14px;font-size:12px;" onclick="document.getElementById('avatarInput').click()">
                                    <i class="fas fa-camera"></i> 更换头像
                                </button>
                                <input type="file" id="avatarInput" accept="image/*" style="display:none;">
                            </div>
                        </div>
                    </div>

                    <!-- 基本资料 -->
                    <div class="info-card">
                        <div class="card-title">
                            <i class="fas fa-user-edit"></i> 基本资料
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>性别</label>
                                <select id="sex">
                                    <option {% if user and user.sex == '女' %}selected{% endif %}>女</option>
                                    <option {% if user and user.sex == '男' %}selected{% endif %}>男</option>
                                    <option {% if user and user.sex == '保密' %}selected{% endif %}>保密</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>出生日期</label>
                                <input type="date" id="birth" value="{{ user.birth if user else '' }}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>个人简介</label>
                            <textarea id="introduction" rows="3" placeholder="介绍一下自己...">{{ user.introduction if user else '' }}</textarea>
                        </div>
                    </div>

                    <!-- 联系信息 -->
                    <div class="info-card">
                        <div class="card-title">
                            <i class="fas fa-address-card"></i> 联系方式
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>电子邮箱</label>
                                <input type="email" id="email" value="{{ user.email if user else '' }}">
                            </div>
                            <div class="form-group">
                                <label>手机号码</label>
                                <input type="tel" id="phone" value="{{ user.phone if user else '' }}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>所在地区</label>
                            <input type="text" id="area" value="{{ user.area if user else '' }}">
                        </div>
                    </div>

                    <!-- 修改密码 -->
                    <div class="info-card">
                        <div class="card-title">
                            <i class="fas fa-lock"></i> 安全设置
                        </div>
                        <div class="password-group">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>当前密码</label>
                                    <input type="password" id="oldPw" placeholder="请输入当前密码">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>新密码</label>
                                    <input type="password" id="newPw" placeholder="至少8位">
                                </div>
                                <div class="form-group">
                                    <label>确认新密码</label>
                                    <input type="password" id="cfmPw" placeholder="再次输入">
                                </div>
                            </div>
                            <div style="margin-top: 12px;">
                                <button id="updatePwBtn" class="btn-save" style="background: #6B7280;"><i class="fas fa-key"></i> 更新密码</button>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 16px; margin-top: 16px; margin-bottom: 40px;">
                        <button class="btn-save btn-secondary">取消</button>
                        <button id="saveProfileBtn" class="btn-save"><i class="fas fa-save"></i> 保存全部更改</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script>
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const toggleBtn = document.getElementById('navbarToggleBtn');
    function toggleSidebar(){
        sidebar.classList.toggle('show');
        overlay.classList.toggle('show');
    }
    toggleBtn.addEventListener('click',toggleSidebar);
    overlay.addEventListener('click',toggleSidebar);
    window.addEventListener('resize',()=>{
        if(window.innerWidth>=769){
            sidebar.classList.remove('show');
            overlay.classList.remove('show');
        }
    });
    document.querySelectorAll('.menu-item').forEach(i=>{
        i.addEventListener('click',()=>{
            document.querySelectorAll('.menu-item').forEach(x=>x.classList.remove('active'));
            i.classList.add('active');
            if(window.innerWidth<769) toggleSidebar();
        });
    });
</script>

<script>
// 更新密码
document.getElementById('updatePwBtn').addEventListener('click', async () => {
    const old = document.getElementById('oldPw').value;
    const newPw = document.getElementById('newPw').value;
    const cfm = document.getElementById('cfmPw').value;
    if (!old || !newPw || !cfm) return alert('请填写完整');
    if (newPw !== cfm) return alert('两次密码不一致');
    const res = await fetch('/api/update-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPassword: old, newPassword: newPw })
    });
    const data = await res.json();
    alert(data.msg);
    if (data.success) {
        document.getElementById('oldPw').value = '';
        document.getElementById('newPw').value = '';
        document.getElementById('cfmPw').value = '';
    }
});

// 保存资料
document.getElementById('saveProfileBtn').addEventListener('click', async () => {
    const data = {
        sex: document.getElementById('sex').value,
        birth: document.getElementById('birth').value,
        introduction: document.getElementById('introduction').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        area: document.getElementById('area').value
    };
    const res = await fetch('/api/update-profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    });
    const result = await res.json();
    alert(result.msg);
    if (result.success) location.reload();
});

// ==============================================
// ✅ 最终完美方案：图片转Base64存入数据库，不上传服务器、刷新永久保存
// ==============================================
// ==============================================
// ✅ 终极不报错版：自动压缩图片，永远不触发1406错误
// ==============================================
document.getElementById('avatarInput').addEventListener('change', async function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            // 自动压缩图片（宽高自适应，质量0.6 = 清晰且小体积）
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            // 最大尺寸 400px，防止过大
            const maxSize = 400;
            if (width > height && width > maxSize) {
                height = (height * maxSize) / width;
                width = maxSize;
            } else if (height > maxSize) {
                width = (width * maxSize) / height;
                height = maxSize;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            // 压缩后转base64
            const compressedBase64 = canvas.toDataURL("image/jpeg", 0.6);

            // 显示头像
            document.getElementById('userAvatar').src = compressedBase64;

            // 存入数据库
            fetch('/api/update-avatar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ avatarBase64: compressedBase64 })
            }).then(res => res.json()).then(data => {
                alert(data.msg);
            });
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
});
</script>
</body>
</html>
