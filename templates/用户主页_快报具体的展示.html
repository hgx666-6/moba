<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>欢迎来到*****wiki！</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../css/通用样式——整体的.css" rel="stylesheet">
	<link href="../css/用户展示帖样式.css" rel="stylesheet">
	<style>
		.scroll-area h2{
			color:hsla(0,0%,100%,1.00);
		}
		.scroll-area h5{
			color:hsla(0,0%,100%,1.00);
		}
		.button-for-like{
			background-color: #4CAF50;
  			color: white;
  			padding: 5px 20px 5px 20px;
  			border: none;
  			border-radius: 4px;
  			cursor: pointer;
			float:left;
		}.button-for-dislike{
			background-color: hsla(359,100%,50%,1.00);
  			color: white;
  			padding: 5px 20px 5px 20px;
  			border: none;
  			border-radius: 4px;
  			cursor: pointer;
			float:right;
		}
		.button-for-like:hover{
			background-color:#317234;
		}
		.button-for-dislike:hover{
			background-color:hsla(359,100%,26%,1.00);
		}
	</style>
</head>
<body>
<div class="app-container">
    <!-- 顶部导航栏 (Bootstrap 风格) -->
    <nav class="navbar">
        <div class="navbar-brand">
            <img src="#" alt="..." height="50" width="50">
            <span style="color:hsla(0,0%,100%,1.00)">用户的项目主页静态模板</span>
        </div>
        <!-- 汉堡按钮 (移动端控制侧边栏) -->
        <button class="navbar-toggler" id="navbarToggleBtn">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- 下方主区域：侧边栏 + 内容区 -->
    <div class="content-wrapper">
        <!-- 侧边栏：历史对话列表 (无标题) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <div id="conversationList" class="conversation-list">
                    <!-- 静态示例列表，纯展示 -->awa
                </div>
            </div>
        </aside>	

        <!-- 移动端遮罩层 -->
        <div class="sidebar-overlay" id="overlay"></div>

        <!-- 主内容区：无对话功能，独立滚动 -->
        <main class="main-content">
            <div class="content-header">
                <div class="content-title">峡谷快报</div>
            </div>
            <div class="scroll-area">
 <!------------------------------------------------------------------------------------------------------------------------->
                <div class="newdiv">
					<h1>这里是快报标题</h1>
					<h3>这里是副标题</h3>
					<h5>这里是小标题</h5>
				
					<div class="scroll-tip"></div>
				<!--这里的排列用于分布一些按钮（比如点赞等）-->
					<div class="row">
					<form method="post" action="#">
						<button class="button-for-like" type="submit"><img src="../img/手绘卡通真棒大拇指点赞 推荐手势手指 人物动作 (50)-298px_爱给网_aigei_com (1).png" alt="..." height="15" width="15"></button>
					
						<button class="button-for-dislike" type="submit"><img src="../img/dislike.png" alt="..." height="15" width="15"></button>
					</form>
					</div>
				</div>	
				
			<div style="height: 20px;"></div>
            </div>
        </main>
    </div>
</div>

<script src="../javascript/通用js代码.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
