<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营商 - 帖子详情</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url("/static/background.png") center/cover fixed;
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 900px;
            margin: 50px auto;
            background: rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(5px);
        }
        .content {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-top: 20px;
            white-space: pre-wrap;
        }
        .back-btn {
            margin-bottom: 20px;
        }
        .post-author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .author-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }
        .label{
            color:#ccc;
            margin-right:6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/operator" class="btn btn-outline-light back-btn">
            <i class="fas fa-arrow-left"></i> 返回管理列表
        </a>

        <div class="post-author">
            <img src="{{ post.author_avatar if post.author_avatar else '/static/default_avatar.png' }}" class="author-avatar">
            <span class="author-name">{{ post.author_name }}</span>
        </div>

        <h1>{{ post.title }}</h1>
        <hr style="border-color: rgba(255,255,255,0.3);">
        
        <div class="mb-2">
            <span class="label">分类：</span><span class="text-info">{{ post.category }}</span>
            <span class="label ms-3">浏览量：</span><span class="text-warning">{{ post.views }}</span>
        </div>
        
        <div class="content">{{ post.content }}</div>
    </div>
</body>
</html>
