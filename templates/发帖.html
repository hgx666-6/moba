<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新帖</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url("/static/background.png") center/cover fixed;
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 50px auto;
            background: rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 16px;
            backdrop-filter: blur(6px);
        }
        .form-control {
            background: #222 !important;
            color: white !important;
            border: 1px solid #555;
        }
        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="mb-4">发布新帖子</h3>
        <form action="/post/add" method="post">
            <div class="mb-3">
                <label>标题</label>
                <input type="text" name="title" class="form-control" required placeholder="请输入标题">
            </div>

            <!-- ====================== ✅ 分类选项 ====================== -->
            <div class="mb-3">
                <label>选择分类</label>
                <select name="category" class="form-control" required>
                    <option value="">请选择分类</option>
                    <option value="交流">交流</option>
                    <option value="赛事">赛事</option>
                    <option value="官方">官方</option>
                    <option value="更多">更多</option>
                </select>
            </div>

            <div class="mb-3">
                <label>内容</label>
                <textarea name="content" rows="10" class="form-control" required placeholder="请输入内容"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">发布帖子</button>
        </form>
        <div class="mt-3 text-center">
            <a href="/tiezi" class="btn btn-outline-light">返回列表</a>
        </div>
    </div>
</body>
</html>
