<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>这里是****wiki</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<link href="../css/通用样式——整体的.css" rel="stylesheet">
	<style>
		.div-for-card-own{
			width:100px;
			padding:5px;
			border:2px solid hsla(249,84%,30%,1.00);
			margin:30px;
			background-color: hsla(0,0%,0%,0.40);
		}
	</style>
</head>
<body>
	<!--一阶段设计：完成所有需要的基本功能（不包括美化）-->
<div class="app-container">
    <!-- 顶部导航栏 (黑色风格) -->
    <nav class="navbar">
        <div class="navbar-brand">
            <span style="color:#ffffff"><img alt="..." src="../img/background.png" height="20" width="40">****wiki</span>
        </div>
        <!-- 汉堡按钮 (移动端控制侧边栏) -->
        <button class="navbar-toggler" id="navbarToggleBtn">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- 下方主区域：侧边栏 + 内容区 -->
    <div class="content-wrapper">
        <!-- 侧边栏：历史对话列表 (纯展示) 黑色主题 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-inner">
                <div id="conversationList" class="conversation-list">
                     
                </div>
            </div>
        </aside>

        <!-- 移动端遮罩层 -->
        <div class="sidebar-overlay" id="overlay"></div>

        <!-- 主内容区：无对话功能，独立滚动，带背景图片 -->
        <main class="main-content">
            <div class="content-header">
                <div class="content-title"><i class="fas fa-image" style="margin-right: 8px;"></i> ****功能</div>
            </div>
            <div class="scroll-area">
				
        		<div style="margin-top: 30px; display: flex; flex-direction: column; gap: 16px;">
            <div class="long-width-button-or-href">
                <i class="fas fa-layer-group" style="margin-right: 10px;"></i> 内容区块一 · 仅用于展示滚动区域
            </div>
            <div class="long-width-button-or-href">
                <i class="fas fa-layer-group" style="margin-right: 10px;"></i> 内容区块二 · 主页可独立滑动
            </div>
            <div class="long-width-button-or-href">
                <i class="fas fa-layer-group" style="margin-right: 10px;"></i> 内容区块三 · 侧边栏与主页滚动互不干扰
            </div>
            <div class="long-width-button-or-href">
                <i class="fas fa-layer-group" style="margin-right: 10px;"></i> 内容区块四 · 符合3:7比例布局
            </div>
            <div class="long-width-button-or-href">
                <i class="fas fa-layer-group" style="margin-right: 10px;"></i> 内容区块五 · 无折叠侧边栏，始终可见
            </div>
        </div>
				
            	<div style="height: 20px;"></div>
			
            </div>
        </main>
    </div>
</div>

<script src="../javascript/通用js代码.js"></srcipt>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
