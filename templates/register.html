<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBA 系统登录</title>
    <style>
        *{
            box-sizing: border-box;
            color:hsla(0,0%,100%,1.00);
        }
        html{
            background-color:linear-gradient(0deg,rgba(0,0,0,0.4) 0%,rgba(0,0,0,0.75) 100%);
            background-image:url("/static/background.png");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: rgba(255,255,255,0.2) !important;
            color: #fff !important;
        }
        select option {
            background: #333 !important;
            color: #fff !important;
        }
        label {
            padding: 12px 0;
            display: inline-block;
        }
        h2 {
            text-align: center;
            color: aliceblue;
        }
        .container {
            border-radius: 5px;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            width:400px;
            margin:100px auto;
            box-shadow: 0 15px 25px rgba(0,0,0,.6);
        }
        .col-25 { float: left; width: 25%; margin-top:6px; }
        .col-75 { float: left; width: 75%; margin-top:6px; }
        .row:after { content: ""; display: table; clear: both; }
        
        .btn {
            padding: 10px 20px;
            margin-top: 20px;
            color: #03e9f4;
            position: relative;
            overflow: hidden;
            left: 35%;
            background: #111;
            cursor: pointer;
        }
        .btn:hover {
            background: #03e9f4;
            color:#fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="loginForm">
            <h2>MOBA 系统登录</h2>

            <div class="row">
                <div class="col-25"><label>用户名</label></div>
                <div class="col-75"><input type="text" id="username" required></div>
            </div>

            <div class="row">
                <div class="col-25"><label>密码</label></div>
                <div class="col-75"><input type="password" id="password" required></div>
            </div>

            <div class="row">
                <div class="col-25"><label>角色</label></div>
                <div class="col-75">
                    <select id="role">
                        <option value="用户">用户</option>
                        <option value="运营商">运营商</option>
                        <option value="管理员">管理员</option>
                    </select>
                </div>
            </div>

            <button class="btn" type="submit">登录</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role })
                });

                const data = await res.json();

                if (data.success) {
                    alert('登录成功！正在跳转...');
                    // 根据后端返回地址自动跳转
                    window.location.href = data.jump;
                } else {
                    alert(data.msg || '登录失败！');
                }
            } catch (err) {
                alert('服务器未启动！');
            }
        });
    </script>
</body>
</html>
